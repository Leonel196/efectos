<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-green-300">
        <h1 class="text-red-500">
            Hola Mundo probando Tailwind
        </h1>
        <div class="bg-yellow-400">
            <h2 class="text-blue-900">Tailwind por: Leonel Brian Machicado Choque</h2>
        </div>
        <div class="container bg-pink-500">
            <p class="font-sans">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. </p>
        </div>
        <!-- Contenedor de imagenes de la página-->
        <div class="container mx-auto px-8 py-12 flex flex-col gap-12">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 justify-items-center">
                <!--Blur-->
                <div class="w-92 h-92 rounded-full overflow-hidden shadow-lg">
                    <img src="img/3.jpg" alt="Imagen 3" class="w-full h-full object-cover blur-sm">
                </div>

                <!--Transparente-->
                <div class="w-92 h-92 rounded-full overflow-hidden shadow-lg bg-gray-100">
                    <img src="img/3.jpg" alt="Imagen 3" class="w-full h-full object-cover opacity-50">
                </div>

                <!--Escala de grises-->
                <div class="w-92 h-92 rounded-full overflow-hidden shadow-lg">
                    <img src="img/3.jpg" alt="Imagen 3" class="w-full h-full object-cover grayscale">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 justify-items-center">
                <!--Intensidad-->
                <div class="w-92 h-92 overflow-hidden shadow-lg">
                    <img src="img/3.jpg" alt="Imagen 3" class="w-full h-full object-cover saturate-200">
                </div>

                <!--Opacidad-->
                <div class="w-92 h-92 overflow-hidden shadow-lg bg-gray-200">
                    <img src="img/3.jpg" alt="Imagen 3" class="w-full h-full object-cover opacity-25">
                </div>
                <!--Psicodélico-->
                <div class="w-92 h-92 overflow-hidden shadow-lg">
                    <img src="img/3.jpg" alt="Imagen 3" class="w-full h-full object-cover hue-rotate-90">
                </div>
            </div>
        </div>
        <!-- Contenedor de imagenes de la página -->
        <div class="container bg-gold-500 border-[5px] border-black text-center">
            <h2 class="font-bold text-lg">Diseñado por: Leonel Brian Machicado Choque</h2>
        </div>
    </body>
</html>
